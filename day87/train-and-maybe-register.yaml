apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate

metadata:
  name: train-and-maybe-register
  namespace: argo

spec:
  entrypoint: main

  arguments:
    parameters:
      - name: min_score
        value: "0.80"

  templates:

    # =====================================================
    # MAIN WORKFLOW
    # =====================================================
    - name: main

      steps:

        # Step 1: Train
        - - name: train
            template: train

        # Step 2: Evaluate
        - - name: evaluate
            template: evaluate

        # Step 3: Register only if score >= min_score
        - - name: register
            template: register

            when: "{{steps.evaluate.outputs.parameters.score}} >= {{workflow.parameters.min_score}}"


    # =====================================================
    # TRAIN
    # =====================================================
    - name: train

      container:
        image: alpine:3.19

        command:
          - sh
          - -c

        args:
          - |
            echo "[train] fitting model"
            sleep 2
            echo "[train] training completed"


    # =====================================================
    # EVALUATE
    # =====================================================
    - name: evaluate

      script:
        image: alpine:3.19

        command:
          - sh

        source: |
          # Deterministic synthetic score
          # Teaching point is parameter passing and gating.
          echo "0.75" > /tmp/score.txt

          echo "[evaluate] score=0.75"

      # TODO 1:
      # Publish /tmp/score.txt as an Argo output parameter.
      outputs:
        parameters:
          - name: score
            valueFrom:
              path: /tmp/score.txt


    # =====================================================
    # REGISTER
    # =====================================================
    - name: register

      container:
        image: alpine:3.19

        command:
          - sh
          - -c

        args:
          - |
            echo "[register] promoting model to registry"