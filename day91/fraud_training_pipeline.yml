spec:
  templates:
    - name: main
      inputs: {}
      outputs: {}
      metadata: {}
      steps:
        - - name: train
            template: train
            arguments: {}
        - - name: register
            template: register
            arguments:
              parameters:
                - name: run_id
                  value: "{{steps.train.outputs.parameters.run_id}}"
    - name: train
      inputs: {}
      outputs:
        parameters:
          - name: run_id
            valueFrom:
              path: /tmp/run_id
      metadata: {}
      script:
        name: ""
        image: python:3.11-slim
        command:
          - python
        env:
          - name: MLFLOW_TRACKING_URI
            value: http://mlflow.mlflow.svc.cluster.local:5000
        resources: {}
        source: |
          import os, subprocess, sys
          subprocess.check_call([sys.executable, "-m", "pip", "install",
              "--quiet", "mlflow==2.20.0", "scikit-learn"])
          import mlflow, mlflow.sklearn
          from sklearn.dummy import DummyClassifier
          import numpy as np

          mlflow.set_tracking_uri(os.environ["MLFLOW_TRACKING_URI"])
          mlflow.set_experiment("fraud-detector")

          X = np.zeros((20, 4)); y = [0, 1] * 10
          model = DummyClassifier(strategy="most_frequent").fit(X, y)

          with mlflow.start_run() as run:
              mlflow.log_metric("f1_score", 0.82)
              mlflow.sklearn.log_model(model, artifact_path="model")
              with open("/tmp/run_id", "w") as f:
                  f.write(run.info.run_id)
              print(f"[train] run_id={run.info.run_id}")
    - name: register
      inputs:
        parameters:
          - name: run_id
      outputs: {}
      metadata: {}
      script:
        name: ""
        image: python:3.11-slim
        command:
          - python
        env:
          - name: MLFLOW_TRACKING_URI
            value: http://mlflow.mlflow.svc.cluster.local:5000
        resources: {}
        source: |
          import os, subprocess, sys
          subprocess.check_call([sys.executable, "-m", "pip", "install",
              "--quiet", "mlflow==2.20.0"])
          import mlflow
          mlflow.set_tracking_uri(os.environ["MLFLOW_TRACKING_URI"])
          run_id = "{{inputs.parameters.run_id}}"
          if not run_id or run_id == "None":
              raise SystemExit(
                  "register received an empty run_id. "
                  "Check the parameter reference on the register step."
              )
          result = mlflow.register_model(
              f"runs:/{run_id}/model", "fraud-detector",
          )
          print(f"[register] {result.name} v{result.version}")
  entrypoint: main
  arguments: {}
