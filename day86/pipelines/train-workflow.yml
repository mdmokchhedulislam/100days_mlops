apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: training-pipeline-
  namespace: argo
  labels:
    lab: day86
spec:
  entrypoint: main
  volumeClaimTemplates:
    - metadata:
        name: workdir
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 64Mi
  templates:
    - name: main
      dag:
        tasks:
          - name: data-prep
            template: data-prep
          - name: train
            template: train
            dependencies: [data-prep]
          - name: evaluate
            template: evaluate
            dependencies: [train]

    - name: data-prep
      container:
        image: alpine:3.19
        command: [sh, -c]
        args:
          - |
            echo "[data-prep] preparing data"
            sleep 2
            echo 'rows=100' > /workdir/data.txt
            echo "[data-prep] done"
        volumeMounts:
          - name: workdir
            mountPath: /workdir
    - name: train
      container:
        image: alpine:3.19
        command: [sh, -c]
        args:
          - |
            echo "[train] training model"
            sleep 5
            echo 'model-v1' > /workdir/model.pkl
            echo "[train] done"
        volumeMounts:
          - name: workdir
            mountPath: /workdir
    - name: evaluate
      container:
        image: alpine:3.19
        command: [sh, -c]
        args:
          - |
            echo "[evaluate] checking model"
            if [ ! -f /workdir/model.pkl ]; then
              echo "[evaluate] ERROR: model.pkl not found"
              exit 1
            fi
            cat /workdir/model.pkl
            echo "[evaluate] done"
        volumeMounts:
          - name: workdir
            mountPath: /workdir
