name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ruff
        run: pip install --break-system-packages ruff

      - name: Run ruff
        run: ruff check src tests

  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        test:
          - train
          - data_quality
          - model_contract

    steps:
      - uses: actions/checkout@v4

      - name: Install pytest + runtime deps
        run: pip install --break-system-packages pytest pandas numpy scikit-learn joblib

      - name: Run ${{ matrix.test }} tests
        run: python3 -m pytest tests/test_${{ matrix.test }}.py -v